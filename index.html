<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AV PLAYGROUND — House Engine</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#000; color:#fff; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 10px; font-size: 20px; letter-spacing: .02em; }
    p { margin: 6px 0 16px; opacity: .8; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    button {
      background:#fff; color:#000; border:0; padding:12px 16px; border-radius:10px;
      font-weight:700; cursor:pointer;
    }
    button.secondary { background: rgba(255,255,255,.12); color:#fff; border: 1px solid rgba(255,255,255,.18); }
    .card {
      margin-top: 14px; padding: 14px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
    }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:12px; }
    label { display:block; font-size: 12px; opacity:.8; margin-bottom:8px; }
    input[type="range"] { width:100%; }
    .value { float:right; opacity:.8; font-variant-numeric: tabular-nums; }
    .hint { font-size: 12px; opacity: .75; margin-top: 8px; }
    code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AV PLAYGROUND — House Engine</h1>
    <p>Click <b>Start</b>. Keys: <code>Space</code> toggle. This generates drums + bass + chords/pad + lead + FX in real time.</p>

    <div class="row">
      <button id="start">Start</button>
      <button id="stop" class="secondary" disabled>Stop</button>
      <button id="new" class="secondary" disabled>New Pattern</button>
      <div style="margin-left:auto; opacity:.8;">
        BPM: <span id="bpmText">124</span>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label>Tempo <span class="value" id="bpmVal">124</span></label>
          <input id="bpm" type="range" min="110" max="136" value="124" />
        </div>
        <div>
          <label>Drive (master) <span class="value" id="driveVal">0.15</span></label>
          <input id="drive" type="range" min="0" max="0.6" step="0.01" value="0.15" />
        </div>
        <div>
          <label>Reverb (send) <span class="value" id="revVal">0.22</span></label>
          <input id="reverb" type="range" min="0" max="0.8" step="0.01" value="0.22" />
        </div>
        <div>
          <label>Filter (brightness) <span class="value" id="cutVal">1200</span></label>
          <input id="cutoff" type="range" min="200" max="6000" step="10" value="1200" />
        </div>
      </div>
      <div class="hint">
        If it sounds too “MIDI”: increase Drive slightly, lower Filter cutoff, and keep Reverb modest.
      </div>
    </div>
  </div>

  <!-- Tone.js from CDN -->
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>

  <script>
    // -----------------------------
    // Utilities
    // -----------------------------
    const rand = (a,b)=> a + Math.random()*(b-a);
    const choice = (arr)=> arr[Math.floor(Math.random()*arr.length)];
    const clamp = (x,a,b)=> Math.max(a, Math.min(b,x));

    let isRunning = false;

    // -----------------------------
    // Master chain
    // -----------------------------
    const master = new Tone.Gain(0.9);
    const drive = new Tone.Distortion(0.15);
    drive.oversample = "2x";

    const toneFilter = new Tone.Filter(1200, "lowpass");
    toneFilter.Q.value = 0.7;

    const reverb = new Tone.Reverb({ decay: 4.2, wet: 0.22, preDelay: 0.02 });
    const delay = new Tone.PingPongDelay({ delayTime: "8n", feedback: 0.22, wet: 0.12 });

    // Small glue compressor
    const comp = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.02, release: 0.2 });

    // Master routing
    master.chain(drive, toneFilter, comp, delay, Tone.Destination);
    // Reverb as send
    const verbSend = new Tone.Gain(0.25).connect(reverb);
    reverb.connect(Tone.Destination);

    // -----------------------------
    // Instruments
    // -----------------------------
    // Kick: sine + pitch envelope
    const kick = new Tone.MembraneSynth({
      pitchDecay: 0.02,
      octaves: 6,
      oscillator: { type: "sine" },
      envelope: { attack: 0.001, decay: 0.35, sustain: 0, release: 0.01 }
    }).connect(master);

    // Clap / Snare-ish
    const clap = new Tone.NoiseSynth({
      noise: { type: "white" },
      envelope: { attack: 0.001, decay: 0.16, sustain: 0 }
    }).connect(master);

    // Hats
    const hat = new Tone.MetalSynth({
      frequency: 300,
      envelope: { attack: 0.001, decay: 0.08, release: 0.01 },
      harmonicity: 6.5,
      modulationIndex: 32,
      resonance: 4000,
      octaves: 1.5
    }).connect(master);

    // Bass (house: plucky / slightly filtered)
    const bass = new Tone.MonoSynth({
      oscillator: { type: "sawtooth" },
      filter: { Q: 1.2, type: "lowpass", rolloff: -24 },
      envelope: { attack: 0.01, decay: 0.22, sustain: 0.15, release: 0.12 },
      filterEnvelope: { attack: 0.01, decay: 0.18, sustain: 0.0, release: 0.08, baseFrequency: 80, octaves: 2.3 }
    });
    bass.connect(master);
    bass.connect(verbSend);

    // Chords / Pad (poly)
    const pad = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.3, decay: 0.6, sustain: 0.7, release: 1.6 }
    });
    pad.connect(master);
    pad.connect(verbSend);

    // Lead (simple)
    const lead = new Tone.MonoSynth({
      oscillator: { type: "square" },
      filter: { Q: 0.8, type: "lowpass", rolloff: -12 },
      envelope: { attack: 0.01, decay: 0.18, sustain: 0.2, release: 0.12 },
      filterEnvelope: { attack: 0.01, decay: 0.12, sustain: 0.0, release: 0.06, baseFrequency: 300, octaves: 2.0 }
    });
    lead.connect(master);
    lead.connect(verbSend);

    // FX riser noise
    const fx = new Tone.NoiseSynth({
      noise: { type: "pink" },
      envelope: { attack: 0.02, decay: 0.3, sustain: 0.0, release: 0.2 }
    });
    const fxFilter = new Tone.Filter(500, "bandpass").connect(master);
    fx.connect(fxFilter);
    fx.connect(verbSend);

    // -----------------------------
    // Pattern / Harmony
    // -----------------------------
    // Minor-ish house keys
    const keys = [
      { root: "A", scale: ["A","B","C","D","E","F","G"] },
      { root: "C", scale: ["C","D","Eb","F","G","Ab","Bb"] },
      { root: "D", scale: ["D","E","F","G","A","Bb","C"] },
      { root: "E", scale: ["E","F#","G","A","B","C","D"] }
    ];

    let current = makePattern();

    function makePattern() {
      const key = choice(keys);
      const bpm = Math.floor(rand(120, 128));

      // Simple 4-chord loop (i - VI - III - VII type)
      const progressions = [
        [0, 5, 2, 6],
        [0, 3, 4, 5],
        [0, 6, 5, 3],
        [0, 2, 5, 6]
      ];
      const prog = choice(progressions);

      // Convert scale degree to triad
      const chordFromDegree = (deg, octave=4) => {
        const s = key.scale;
        const n1 = s[deg % s.length] + octave;
        const n2 = s[(deg+2) % s.length] + octave;
        const n3 = s[(deg+4) % s.length] + octave;
        return [n1, n2, n3];
      };

      // Bass notes: root of chord
      const bassNoteFromChord = (deg) => key.scale[deg % key.scale.length] + "2";

      // 16-step patterns
      // Kick: four-on-the-floor
      const kickSteps = Array(16).fill(0).map((_,i)=> (i % 4 === 0 ? 1 : 0));

      // Clap on 2 and 4 (steps 4 and 12)
      const clapSteps = Array(16).fill(0);
      clapSteps[4] = 1;
      clapSteps[12] = 1;

      // Hats: offbeats + extra ticks
      const hatSteps = Array(16).fill(0).map((_,i)=> (i % 2 === 1 ? 1 : 0));
      // sprinkle some extra
      [3, 7, 11, 15].forEach(i => { if (Math.random() < 0.35) hatSteps[i] = 1; });

      // Bass rhythm (syncopated)
      const bassSteps = Array(16).fill(0);
      [0, 3, 6, 8, 11, 14].forEach(i => { if (Math.random() < 0.85) bassSteps[i] = 1; });

      // Lead rhythm (sparser)
      const leadSteps = Array(16).fill(0);
      [2, 5, 9, 13].forEach(i => { if (Math.random() < 0.6) leadSteps[i] = 1; });

      return {
        key,
        bpm,
        prog,
        chordFromDegree,
        bassNoteFromChord,
        kickSteps,
        clapSteps,
        hatSteps,
        bassSteps,
        leadSteps
      };
    }

    // -----------------------------
    // Transport + Scheduling
    // -----------------------------
    Tone.Transport.bpm.value = 124;
    Tone.Transport.swing = 0.12;

    let step = 0;        // 0..15
    let bar = 0;         // increments every 16 steps (1 bar of 16th notes)
    let chordIndex = 0;  // 0..3 in progression

    const loop = new Tone.Loop((time) => {
      const s = step;

      // ---- DRUMS
      if (current.kickSteps[s]) kick.triggerAttackRelease("C1", "8n", time, 1.0);
      if (current.clapSteps[s]) clap.triggerAttackRelease("16n", time, 0.35);
      if (current.hatSteps[s]) hat.triggerAttackRelease("16n", time, 0.15);

      // ---- CHORDS (pad) changes each bar
      if (s === 0) {
        const deg = current.prog[chordIndex];
        const chord = current.chordFromDegree(deg, 4);
        pad.triggerAttackRelease(chord, "1m", time, 0.30);

        // occasional FX on chord change (for movement)
        if (Math.random() < 0.35) {
          fxFilter.frequency.rampTo(rand(400, 1200), 0.08);
          fx.triggerAttackRelease("8n", time, 0.08);
        }
      }

      // ---- BASS follows chord root
      if (current.bassSteps[s]) {
        const deg = current.prog[chordIndex];
        const note = current.bassNoteFromChord(deg);
        bass.triggerAttackRelease(note, "16n", time, 0.55);
      }

      // ---- LEAD uses scale tones
      if (current.leadSteps[s]) {
        const deg = current.prog[chordIndex];
        const scale = current.key.scale;
        // pick chord tones + neighbor
        const opts = [
          scale[deg % scale.length] + "5",
          scale[(deg+2) % scale.length] + "5",
          scale[(deg+4) % scale.length] + "5",
          scale[(deg+1) % scale.length] + "5"
        ];
        lead.triggerAttackRelease(choice(opts), "16n", time, 0.20);
      }

      // Step advance
      step = (step + 1) % 16;

      // Bar boundary
      if (step === 0) {
        bar++;
        chordIndex = (chordIndex + 1) % 4;

        // Every 8 bars: "mini drop" by muting hats for a bar sometimes
        if (bar % 8 === 0 && Math.random() < 0.55) {
          const saved = current.hatSteps.slice();
          current.hatSteps = current.hatSteps.map((v,i)=> (i < 8 ? 0 : v));
          setTimeout(()=> { current.hatSteps = saved; }, 600);
        }
      }
    }, "16n");

    // -----------------------------
    // UI wiring
    // -----------------------------
    const $ = (id)=> document.getElementById(id);

    function setBpm(v){
      Tone.Transport.bpm.rampTo(v, 0.08);
      $("bpmText").textContent = String(v);
      $("bpmVal").textContent = String(v);
    }

    function setDrive(v){
      drive.distortion = v;
      $("driveVal").textContent = v.toFixed(2);
    }

    function setReverb(v){
      reverb.wet.value = v;
      verbSend.gain.value = v; // send follows wet
      $("revVal").textContent = v.toFixed(2);
    }

    function setCutoff(v){
      toneFilter.frequency.rampTo(v, 0.08);
      $("cutVal").textContent = String(v);
    }

    $("bpm").addEventListener("input", e => setBpm(Number(e.target.value)));
    $("drive").addEventListener("input", e => setDrive(Number(e.target.value)));
    $("reverb").addEventListener("input", e => setReverb(Number(e.target.value)));
    $("cutoff").addEventListener("input", e => setCutoff(Number(e.target.value)));

    $("start").onclick = async () => {
      if (isRunning) return;

      await Tone.start(); // required by browser
      isRunning = true;

      current = makePattern();
      setBpm(current.bpm);

      loop.start(0);
      Tone.Transport.start("+0.05");

      $("start").disabled = true;
      $("stop").disabled = false;
      $("new").disabled = false;
    };

    $("stop").onclick = async () => {
      if (!isRunning) return;

      isRunning = false;
      Tone.Transport.stop();
      loop.stop();

      // reset counters
      step = 0; bar = 0; chordIndex = 0;

      $("start").disabled = false;
      $("stop").disabled = true;
      $("new").disabled = true;
    };

    $("new").onclick = () => {
      if (!isRunning) return;
      current = makePattern();
      setBpm(current.bpm);
    };

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (!isRunning) $("start").click();
        else $("stop").click();
      }
    });

    // Default values
    setBpm(124);
    setDrive(0.15);
    setReverb(0.22);
    setCutoff(1200);
  </script>
</body>
</html>
